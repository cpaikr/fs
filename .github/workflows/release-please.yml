name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    if: github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          skip-github-release: true

  github-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Verify public release preconditions
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          test "$REPOSITORY_VISIBILITY" = "public"
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          manifest_version="$(node -p 'require("./.release-please-manifest.json")["."]')"
          published_version="$(npm view "$package_name@$package_version" version)"
          test "$manifest_version" = "$package_version"
          test "$published_version" = "$package_version"
      - uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          skip-github-pull-request: true
