name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  changes:
    name: classify change scope
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      full_ci: ${{ steps.scope.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base_sha="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          head_sha="${PR_HEAD_SHA:-$EVENT_SHA}"
          full_ci=true

          if [[ -n "$base_sha" && -n "$head_sha" ]] &&
            [[ ! "$base_sha" =~ ^0+$ ]] &&
            git cat-file -e "${base_sha}^{commit}" &&
            git cat-file -e "${head_sha}^{commit}"; then
            full_ci=false
            saw_path=false
            while IFS= read -r -d '' changed_path; do
              saw_path=true
              case "$changed_path" in
                docs/*.md | ROADMAP.md | content/guide/*.md.template | \
                  skills/author-fs/SKILL.md | \
                  skills/author-fs/agents/openai.yaml | \
                  skills/author-fs/guides/*.md | scripts/check-docs.sh | \
                  scripts/render-guide.mjs)
                  ;;
                *)
                  full_ci=true
                  break
                  ;;
              esac
            done < <(
              git diff --no-renames --name-only \
                --diff-filter=ACDMRTUXB -z "$base_sha" "$head_sha"
            )
            if [[ "$saw_path" == false ]]; then
              full_ci=true
            fi
          fi

          printf 'full_ci=%s\n' "$full_ci" >>"$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-latest
          - blacksmith-2vcpu-windows-2025
        node: [22.17.0, 24.15.0]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify package and packed CLI
        run: pnpm verify

  documentation:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check documentation and fixture contracts
        run: pnpm check:docs

  production-audit:
    name: production dependency audit
    needs: changes
    if: ${{ needs.changes.outputs.full_ci == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production dependencies
        run: pnpm audit:prod

  release-candidate:
    name: npm publication check
    needs: [changes, test, documentation, production-audit]
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.full_ci == 'true' &&
        needs.test.result == 'success' &&
        needs.documentation.result == 'success' &&
        needs.production-audit.result == 'success'
      }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify npm publication state
        run: node scripts/check-publication.mjs
