name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-2vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-latest
          - blacksmith-2vcpu-windows-2025
        node: [22.17.0, 24.15.0]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify package and packed CLI
        run: pnpm verify

  documentation:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check documentation and fixture contracts
        run: pnpm check:docs

  production-audit:
    name: production dependency audit
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production dependencies
        run: pnpm audit:prod

  release-candidate:
    name: npm publish dry run
    needs: [test, documentation, production-audit]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify npm publication without publishing
        run: npm publish --dry-run
